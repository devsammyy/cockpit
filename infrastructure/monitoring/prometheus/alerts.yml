# ─── Prometheus Alert Rules ───
# Alerts surface in the Prometheus UI and Grafana's alert panel. To page
# on-call, add an Alertmanager instance and route these to your receiver
# (DingTalk / Slack / email) — see docs/operations/monitoring-guide.md.

groups:
  - name: availability
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend API is down"
          description: "Prometheus cannot scrape the backend /metrics endpoint for over 1 minute."

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "postgres-exporter reports the database as unreachable."

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "redis-exporter reports Redis as unreachable. Queues and caching are impacted."

  - name: api-performance
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx error rate above 5%"
          description: "More than 5% of requests are failing with server errors over the last 5 minutes."

      - alert: HighApiLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 2s"
          description: "95th percentile request latency has exceeded 2 seconds for 10 minutes."

  - name: workloads
    rules:
      - alert: WorkflowFailureSpike
        expr: |
          sum(rate(workflow_executions_total{status="failed"}[15m]))
            / clamp_min(sum(rate(workflow_executions_total[15m])), 0.001) > 0.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "More than 25% of workflow executions are failing"
          description: "Check AI provider health and recent deployments."

      - alert: QueueBacklog
        expr: sum by (queue) (bullmq_queue_jobs{state="waiting"}) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Queue {{ $labels.queue }} backlog above 1000 jobs"
          description: "Workers are not keeping up. Consider scaling workers or investigating stuck jobs."

      - alert: AiProviderErrors
        expr: |
          sum(rate(ai_requests_total{status="error"}[10m]))
            / clamp_min(sum(rate(ai_requests_total[10m])), 0.001) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AI provider error rate above 20%"
          description: "DashScope requests are failing. Check quota, API key validity, and provider status."

  - name: infrastructure
    rules:
      - alert: HostHighMemory
        expr: |
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage above 90%"
          description: "The ECS instance is under memory pressure."

      - alert: HostDiskAlmostFull
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 85% on {{ $labels.mountpoint }}"
          description: "Free disk space is running out. Prune images/logs or expand the cloud disk."

      - alert: PostgresConnectionsSaturated
        expr: sum(pg_stat_activity_count) / pg_settings_max_connections > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections above 80% of max_connections"
          description: "Connection pool pressure detected. Check for leaks or raise limits."
