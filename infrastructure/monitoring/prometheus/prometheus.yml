# ─── Prometheus Configuration ───
# Scrapes metrics from all services in the autopilot-internal network.
# Alert rules loaded from alerts.yml (see docker-compose.monitoring.yml).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'qwen-autopilot'
    environment: 'production'

# Alertmanager not configured; alerts are read directly by Grafana from Prometheus.
# Add alerting: section if Alertmanager is deployed.

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  # ── Prometheus self-monitoring ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Backend API (NestJS + prom-client) ──
  # Metrics endpoint is excluded from global API prefix (see main.ts)
  - job_name: 'backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:4000']

  # ── Frontend (Next.js - not yet instrumented with Prometheus metrics) ──
  # - job_name: 'frontend'
  #   metrics_path: '/api/metrics'
  #   static_configs:
  #     - targets: ['frontend:3000']

  # ── Node Exporter (host metrics) ──
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # ── cAdvisor (container metrics) ──
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # ── PostgreSQL Exporter ──
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ── Redis Exporter ──
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # ── Nginx (if nginx-prometheus-exporter added) ──
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['nginx-exporter:9113']