# ─── Prometheus Configuration ───
# Scrapes application metrics (NestJS /metrics), host metrics (node-exporter),
# container metrics (cAdvisor), and data-store exporters over the internal
# container network. Nothing here is reachable from the public internet.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: qwen-autopilot
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # NestJS backend: HTTP, AI provider, workflow, tool, and queue metrics
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:4000"]
        labels:
          service: backend

  # ECS host metrics: CPU, memory, disk, network
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: host

  # Per-container CPU/memory/network via cAdvisor
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: containers

  # PostgreSQL internals: connections, locks, transaction rates, table stats
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  # Redis internals: memory, ops/sec, keyspace, evictions
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis
