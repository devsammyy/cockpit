# ─── Promtail Configuration ───
# Scrapes Docker container logs and ships them to Loki.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: "docker-logs"
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            container_name: container_name
            container_id: container_id
      - labels:
          container_name:
          container_id:
      - output:
          source: log

  - job_name: promtail-self
    static_configs:
      - targets:
          - localhost
        labels:
          job: "promtail"
          __path__: /var/log/promtail/*.log