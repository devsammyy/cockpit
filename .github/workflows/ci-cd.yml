# ─── GitHub Actions: CI/CD Pipeline ───
# Lint → Type Check → Test → Security Scan → Container Build & Push (ACR)
#   → Image Scan (Trivy) → Deploy (ECS) → Post-deploy Verification
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.31.0"
  # Alibaba Cloud Container Registry (ACR)
  ACR_REGISTRY: registry.ap-southeast-1.aliyuncs.com
  ACR_NAMESPACE: qwen-autopilot
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Lint & Format ──
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

  # ── Type Check ──
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qwen-autopilot/backend db:generate
      - run: pnpm --filter @qwen-autopilot/backend exec tsc --noEmit
      - run: pnpm --filter @qwen-autopilot/frontend build

  # ── Unit Tests ──
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qwen-autopilot/backend db:generate
      - run: pnpm --filter @qwen-autopilot/backend test -- --ci --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/backend/coverage/

  # ── Security Scan (source) ──
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high || true
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
      - name: Trivy filesystem & IaC scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "0" # report-only for source; image scan below is blocking
          format: table

  # ── Infrastructure Validation ──
  infra-validate:
    name: Validate Infrastructure Configs
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Validate nginx HTTP config
        run: |
          docker run --rm --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 \
            -v ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            nginx:1.27-alpine nginx -t
      - name: Validate nginx TLS config (self-signed cert)
        run: |
          mkdir -p /tmp/ssl
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout /tmp/ssl/privkey.pem -out /tmp/ssl/fullchain.pem -subj "/CN=ci-test"
          docker run --rm --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 \
            -v ./infrastructure/nginx/nginx-tls.conf:/etc/nginx/nginx.conf:ro \
            -v /tmp/ssl:/etc/nginx/ssl:ro \
            nginx:1.27-alpine nginx -t
      - name: Validate compose files
        run: |
          POSTGRES_PASSWORD=ci JWT_ACCESS_TOKEN_SECRET=ci QWEN_API_KEY=ci \
          CREDENTIAL_ENCRYPTION_KEY=ci GRAFANA_ADMIN_PASSWORD=ci \
            docker compose -f docker-compose.production.yml -f docker-compose.monitoring.yml config -q
      - name: Validate Prometheus config & alert rules
        run: |
          docker run --rm -v ./infrastructure/monitoring/prometheus:/cfg:ro \
            --entrypoint promtool prom/prometheus:v3.2.1 check config /cfg/prometheus.yml

  # ── Container Build & Push to Alibaba Cloud ACR ──
  container-build:
    name: Build & Push Containers
    runs-on: ubuntu-latest
    needs: [typecheck, test, security, infra-validate]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/backend:${{ env.IMAGE_TAG }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/frontend:${{ env.IMAGE_TAG }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Image Vulnerability Scan (blocking) ──
  image-scan:
    name: Scan Container Images
    runs-on: ubuntu-latest
    needs: container-build
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Trivy image scan (${{ matrix.image }})
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          exit-code: "1" # block deployment on unpatched critical CVEs
          ignore-unfixed: true
          format: table

  # ── Deploy to Alibaba Cloud ECS ──
  deploy:
    name: Deploy to Alibaba Cloud ECS
    runs-on: ubuntu-latest
    needs: image-scan
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy pinned image tag via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/qwen-autopilot
            git fetch origin main && git reset --hard origin/main

            # Login to ACR
            docker login \
              --username=${{ secrets.ACR_USERNAME }} \
              --password=${{ secrets.ACR_PASSWORD }} \
              ${{ env.ACR_REGISTRY }}

            # Pin this deployment to the exact CI-built image (enables rollback)
            grep -q '^IMAGE_TAG=' .env \
              && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${{ env.IMAGE_TAG }}/' .env \
              || echo 'IMAGE_TAG=${{ env.IMAGE_TAG }}' >> .env

            docker compose -f docker-compose.production.yml pull backend frontend
            docker compose -f docker-compose.production.yml up -d --remove-orphans

            # Verify deployment health (containers report healthy + endpoints respond)
            sleep 20
            curl -f http://localhost/health
            curl -f http://localhost/api/v1/health/ready
            echo "✅ Deployment of ${{ env.IMAGE_TAG }} verified"

            # Prune dangling images to control disk usage
            docker image prune -f

      - name: Post-deployment smoke test (k6)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            cd /opt/qwen-autopilot
            docker run --rm -i --network host docker.io/grafana/k6 run \
              -e BASE_URL=http://localhost - < tests/load/smoke.js
