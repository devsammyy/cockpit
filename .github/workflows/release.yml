# ─── GitHub Actions: Release ───
# Triggered by version tags (v1.2.3). Builds version-pinned images, pushes to
# ACR, generates an SBOM, and publishes a GitHub Release with auto-generated
# notes. Deploy a release with the Rollback/Redeploy workflow or by setting
# IMAGE_TAG=v1.2.3 on the server.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  ACR_REGISTRY: registry.ap-southeast-1.aliyuncs.com
  ACR_NAMESPACE: qwen-autopilot

jobs:
  release:
    name: Build, Publish & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend (version-pinned)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/backend:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend (version-pinned)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/frontend:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (backend image)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/backend:${{ steps.version.outputs.version }}
          format: cyclonedx
          output: sbom-backend-${{ steps.version.outputs.version }}.json

      - name: Create GitHub Release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: sbom-backend-${{ steps.version.outputs.version }}.json
          body: |
            ## Container Images (Alibaba Cloud ACR)

            | Service  | Image |
            |----------|-------|
            | Backend  | `${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/backend:${{ steps.version.outputs.version }}` |
            | Frontend | `${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/frontend:${{ steps.version.outputs.version }}` |

            Deploy this release: run the **Rollback / Redeploy** workflow with
            `image_tag: ${{ steps.version.outputs.version }}`.
